<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172835" />
    <meta
      name="description"
      content="A cinematic storybook family adventure from Tony Baloney Studios. Two forms. Five rescues. One very silly uprising."
    />
    <title>The Shadow Puppet Uprising · Tony Baloney Studios</title>
    <link rel="icon" type="image/svg+xml" href="/assets/star.svg" />
  </head>
  <body>
    <main id="app">
      <header class="site-header">
        <a href="#" id="brand" aria-label="Go to main menu"
          ><span class="brand-mark">tb<span>✦</span></span
          ><span
            >TONY BALONEY<span class="studio-word">S T U D I O S</span></span
          ></a
        >
        <div class="header-right">
          <a href="../../index.html" class="icon-button arcade-link" aria-label="Back to NQ's Arcade">Arcade</a>
          <span class="made-by">A BIG ADVENTURE. A FAMILY CREATION.</span
          ><button
            id="fullscreen-toggle"
            class="icon-button fullscreen-button"
            data-fullscreen
            aria-pressed="false"
            aria-label="Enter full screen"
            title="Enter full screen"
          >
            Full screen</button
          ><button
            id="sound-toggle"
            class="icon-button"
            aria-label="Toggle sound"
          >
            ♪</button
          ><button
            id="settings-button"
            class="icon-button"
            aria-label="Settings"
          >
            ⚙
          </button>
        </div>
      </header>
      <section id="game-shell" aria-label="The Shadow Puppet Uprising game">
        <div id="game"></div>
        <div id="ui"></div>
        <div id="hud" hidden></div>
        <div id="toast" role="status" aria-live="polite"></div>
      </section>
      <footer class="site-footer">
        <span><i></i> MADE FOR LITTLE HEROES & BIG IMAGINATIONS</span
        ><span
          >Original characters. Extraordinary family.<span class="version">
            WORKING TITLE · v1.0</span
          ></span
        >
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
