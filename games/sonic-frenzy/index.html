<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonic Frenzy — NQ's Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/arcade.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>

  <div id="site-header" data-back-link="true"></div>

  <main class="game-wrapper">
    <canvas id="c"></canvas>
    <input id="touch-input"
           type="text"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false"
           style="position:absolute; opacity:0; left:-9999px; top:0; width:1px; height:1px; border:none; outline:none; font-size:16px;" />
  </main>

  <div id="site-footer"></div>

  <!-- Shared arcade shell -->
  <script src="../../assets/js/arcade.js"></script>

  <!-- Game modules — load in dependency order -->
  <script src="js/constants.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>  <!-- bootstraps canvas + starts loop -->

</body>
</html>
